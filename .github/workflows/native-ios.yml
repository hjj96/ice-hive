          # mouths), Breaker Run's four breakers (the hub's thrown, its lamps back) and Vent Purge's seal under the hub → A duct
          # mouth (the weld waits for the grille shot shut, fills, waits again when the hive chews through), the mission's
          # heartbeat, frozen for the screenshot
          need breakerrun 'mission start breaker-run steps=switch,hold,extract modifiers=dark props=1 lit=0/7 vents=8 ducts=3'
          need breakerrun "demo breakerrun: breaker-run, lit 0/7, 4 breakers; squad in the hub breaker's ring"
          need breakerrun 'mission: breaker 3 started at \(-5\.5, 23\.5\)'
          need breakerrun "demo breakerrun: the breaker's ring jumped to 0\.99"
          need breakerrun 'mission: breaker 3 thrown, 1/4'
          need breakerrun 'props: circuit 1 restored, lamps 6/6'
          need breakerrun 'hb mission breaker-run step=1/3 switch'
          need breakerrun 'demo breakerrun: frozen td=[0-9.]+ step 2 lit [1-7]/7'
          need ventpurge 'mission start vent-purge steps=switch,hold,extract modifiers= props=1 lit=7/7 vents=8 ducts=3'
          need ventpurge 'demo ventpurge: vent-purge, 4 seals: duct 0, duct 1, duct 2, vent 0; squad in the seal ring under duct 1'
          need ventpurge 'mission: seal 1 started at \(-11\.7, 26\.2\)'
          need ventpurge 'demo ventpurge: in the seal ring under duct 1 td=[0-9.]+, weld waits [01]'
          need ventpurge 'bugs: duct 1 shot shut'
          need ventpurge 'demo ventpurge: duct 1 shot shut td=[0-9.]+, the weld fills'
          need ventpurge 'bugs: duct 1 open again'
          need ventpurge 'demo ventpurge: duct 1 open again td=[0-9.]+, weld waits 1'
          need ventpurge 'hb mission vent-purge step=1/3 switch'
          need ventpurge 'demo ventpurge: frozen td=[0-9.]+ step 4 weld waits [01] ring 0\.6[0-9]'
          need burst-pack 'demo swarmpack: spawned [1-9][0-9]* bugs .*swarm life'
          need burst-packold 'demo swarmpack: spawned [1-9][0-9]* bugs .*swarm legacy'
          # native-vx-fix: the mission's live-bug cap is the tier's under the device class's (the simulator stands in for the
          # iPhone 12: 1400); the particle compute pipelines are built with the render pipelines, so the cover's warm-up
          # already goes through the GPU path. native-vx-feel: the wave pacing's caps (High 350, Medium 250) under the
          # device's 1400 (the demos' forced crowds still spawn past them: stress1400 1400, combat 600)
          need stress1400 'cap 350\)'
          need combat 'bug cap 250 \(graphics [a-z]+ 250, device 1400\)'
          need combat 'particles: compute ready .* with the pipelines'
          # Metal API validation runs: alive, no debug-layer report
          for d in validate-stress validate-fxpeak validate-extract; do
            mine "$d" || continue
            # (the layer's own banner «Metal API Validation Enabled» is the one line a clean run writes)
            grep -q 'Metal API Validation Enabled' "results/app-$d-stderr.log" 2>/dev/null || fail "$d: the Metal debug layer did not come on"
            if grep -v 'Metal API Validation Enabled' "results/app-$d-stderr.log" 2>/dev/null | grep -q -i -E 'MTLDebug|validation|failed assertion|-\[MTL' \
                || grep -q 'MTLDebug' "results/app-$d.log" 2>/dev/null; then
              fail "$d: Metal validation: $(cat "results/app-$d-stderr.log" "results/app-$d.log" 2>/dev/null | grep -v 'Metal API Validation Enabled' | grep -m 3 -i -E 'MTLDebug|validation|failed assertion|-\[MTL' | tr '\n' ' ')"
            fi
            grep -q "^$d alive" results/alive.txt || fail "$d: the app did not survive the Metal validation run"
          done
          # app lifecycle: the loop stopped in the background and came back, the memory warning was handled, the app lived
          need lifecycle 'frame loop paused \(background\)'
          need lifecycle 'frame loop resumed'
          need lifecycle 'memory warning: '
          need lifecycle 'lifecycle probe: done'
          # WP4: the four skinned marines loaded (IHV1 skinned + texture arrays) and animated (rig CPU, foot slide,
          # hand-to-grip error once a second)
          for d in combat squad squadclose squadtight squadfire; do
            mine "$d" || continue
            need "$d" 'squad: 4 marines'
            need "$d" 'hb squad cpu='
            if grep -q 'ERROR' "results/app-$d.log"; then fail "$d: $(grep -m 3 ERROR "results/app-$d.log" | tr '\n' ' ')"; fi
          done
          # landscape-only: every run reports a landscape interface
          for d in $DEMOS layout; do
            mine "$d" || continue
            need "$d" 'scene presented size=[0-9]+x[0-9]+ iface=landscape'
            if grep -q -E 'iface=portrait' "results/app-$d.log"; then fail "$d: portrait interface"; fi
          done
          for d in title-fresh title-return title-nm title-left holdhint coach coach3 levelup pause pause-nm report-first report-win report-loss report-chip layout \
                   layout-pseudo title-pseudo holdhint-pseudo coach3-pseudo levelup-pseudo report-pseudo; do
            mine "$d" || continue
            need "$d" 'layout (ok|FAIL)'
            if grep -q 'layout FAIL' "results/app-$d.log"; then fail "$d: $(grep -m 2 'layout FAIL' "results/app-$d.log" | tr '\n' ' ')"; fi
          done
          # the four landscape phones (LayoutSizes): 4 × (3 titles + HUD + the HUD's transient slots (H1) + pause + 2 level-ups
          # + 5 reports) = 52 checks, in English and pseudo-localised (+35 %)
          need layout 'layout sizes: 52 ok, 0 FAIL on 4 phones'
          need layout-pseudo 'layout sizes: 52 ok, 0 FAIL on 4 phones'
          # L10n: every key resolved (the audit of the layout demos), and no run ever looked up a key the catalog lacks
          need layout 'l10n audit: [0-9]+ keys, 0 missing'
          need layout-pseudo 'l10n audit: [0-9]+ keys, 0 missing'
          if grep -l 'l10n missing' results/app-*.log > /dev/null 2>&1; then
            fail "l10n missing: $(grep -h -m 1 'l10n missing' results/app-*.log | sort -u | head -5 | tr '\n' ' ')"
          fi
          if mine failmetal; then
            grep -q 'failure screen shown' results/app-failmetal.log || { fail "-failMetal: no failure screen"; }
          fi
          if mine release-combat; then
            if [ -s results/app-release-quiet.log ]; then fail "plain Release launch wrote to stdout: $(head -3 results/app-release-quiet.log)"; fi
          fi
          cat results/verify.txt
          exit $bad
      # warm demos: minFps >= 55 on the game loop and no loop hitch > 50 ms after the first second (metrics.txt);
      # runs after a failed «Verify» too, so one run reports both
      - name: Frame metrics gate
        if: success() || failure()
        # (C1: this part's demos; metrics.txt over all of them is written by the report job)
        # shellcheck disable=SC2086
        run: python3 ios-native/ci/frame_metrics.py --gate --cold firstlaunch --cold-max-ms 150 --menus "$MENUS" results $PART_DEMOS
      # LAND: the other landscape phones on real simulators — iPhone SE (667 x 375, no insets), iPhone 16e (844 x 390,
      # notch) and iPhone 16 Plus (932 x 430, Dynamic Island), each when the runtime offers it: the title, the HUD
      # (hold hint, coach card + ghost thumb), the pause, the level-up cards and a report with -layoutCheck, upright
      # landscape screenshots (other-<phone>-<demo>-0s.png), the result lines in other-phones.txt; a «layout FAIL» on
      # any of them fails the job (the virtual four-phone check of the `layout` demo covers all four sizes)
      # (C1: once, in the part that owns `other-phones`)
      - name: Layout check on the other landscape phones
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mine() { case " $SMOKE_B " in *" $1 "*) [ "$PART" = b ];; *) [ "$PART" = a ];; esac; }
          if ! mine other-phones; then echo "the layout check on the other phones runs in the other part"; exit 0; fi
          set -x
          mkdir -p results
          : > results/other-phones.txt
          rt=$(sed -n 3p sim.txt)
          upright() { ios-native/ci/upright.sh "$1" "$2"; }
          xcrun simctl shutdown "$UDID" || true
          for phone in "se|iPhone-SE-3rd-generation" "16e|iPhone-16e" "16plus|iPhone-16-Plus"; do
            tag="${phone%%|*}"; dt="com.apple.CoreSimulator.SimDeviceType.${phone#*|}"
            if ! xcrun simctl list devicetypes | grep -q "$dt"; then echo "== $tag: no device type $dt" | tee -a results/other-phones.txt; continue; fi
            dev=$(xcrun simctl create "layout $tag" "$dt" "$rt" 2>/dev/null) || { echo "== $tag: not available on $rt" | tee -a results/other-phones.txt; continue; }
            xcrun simctl boot "$dev" && xcrun simctl bootstatus "$dev" -b
            xcrun simctl install "$dev" IceHive.app
            # (L10n: the beacon defence for its banner (held), toast, hint and objective line, every report variant, and on the SE the
            # pseudo-localised title: every screen and moment in English on every phone)
            runs=("title-return|3|-demo title -profile veteran" "holdhint|8|-demo holdhint -seed 3" "coach3|6|-demo coach -coachStep 2 -seed 7"
                  "pause|3|-demo pause -seed 5" "levelup|3|-demo levelup -seed 5" "report-win|3|-demo report -report win -seed 5"
                  "beacon|8|-demo beacon -seed 7 -holdBanner" "report-loss|3|-demo report -report loss -seed 5" "report-first|3|-demo report -report first -seed 5")
            if [ "$tag" = se ]; then runs+=("title-pseudo|3|-demo title -profile veteran -pseudoLoc 1.35"); fi
            # (R0 film fixes: the four classes at the game camera on the smallest screen — the class accent read)
            if [ "$tag" = se ]; then runs+=("squad|3|-demo calm -squadSheet"); fi
            for d in "${runs[@]}"; do
              label="other-$tag-${d%%|*}"; rest="${d#*|}"; secs="${rest%%|*}"; args="${rest#*|}"
              # shellcheck disable=SC2086
              xcrun simctl launch --terminate-running-process --stdout="$PWD/results/app-$label.log" --stderr="$PWD/results/app-$label-stderr.log" \
                "$dev" "$BUNDLE_ID" $args -orient right -layoutCheck -seconds "$secs"
              for _ in $(seq 1 60); do grep -q 'demo done' "results/app-$label.log" 2>/dev/null && break; sleep 1; done
              xcrun simctl io "$dev" screenshot "results/$label-0s.png" || true
              upright "results/$label-0s.png" "results/app-$label.log"
              { echo "== $label"; grep -h -E 'scene presented|layout (ok|FAIL)|report: tightest|hint 2 lines' "results/app-$label.log" || echo "no layout line"; } >> results/other-phones.txt
              xcrun simctl terminate "$dev" "$BUNDLE_ID" || true
              sleep 2
            done
            xcrun simctl shutdown "$dev" || true
            xcrun simctl delete "$dev" || true
          done
          cat results/other-phones.txt
          if grep -q 'layout FAIL' results/other-phones.txt; then echo "::error::layout FAIL on another phone: $(grep -m 3 'layout FAIL' results/other-phones.txt | tr '\n' ' ')"; exit 1; fi
          if grep -h 'l10n missing' results/app-other-*.log 2>/dev/null | head -3 | grep -q .; then echo "::error::l10n missing on another phone"; exit 1; fi
      - name: Collect crash logs and stop
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p results
          if [ -f logstream.pid ]; then kill "$(cat logstream.pid)" 2>/dev/null || true; fi
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i icehive | head -3 | while read -r f; do
            cp ~/Library/Logs/DiagnosticReports/"$f" results/ || true
          done
          # keep app.log reasonably small
          if [ -f results/app.log ]; then tail -n 2000 results/app.log > results/app.log.tmp && mv results/app.log.tmp results/app.log; fi
          ls -la results
      # (not results-*: the report job merges the two parts itself, file by file)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-smoke-${{ matrix.part }}
          path: results/
          retention-days: 7

  report:
    name: report
    needs: [core-tests, build, sim-smoke]
    if: always()
    runs-on: ubuntu-latest
    # the ci-results tree grows with every run: fetching its tip and pushing ~150 MB took 7–10+ min
    timeout-minutes: 30
    steps:
      # (before the artifacts: checkout cleans the workspace) the look scripts, their golden frames and the game's font
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios-native/ci
            ios-native/App/Resources/Fonts
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: results
        continue-on-error: true
      # C1: the two sim-smoke parts, each into its own folder (smoke/sim-smoke-a, smoke/sim-smoke-b)
      - uses: actions/download-artifact@v4
        with:
          pattern: sim-smoke-*
          path: smoke
        continue-on-error: true
      # C1: one result set from the two parts, as the one sim-smoke job wrote it before the split. Every demo, burst and
      # check runs in one part, so its files are copied as they are; the text files both parts write are joined, part a
      # first (each part's lines in its run order; app.log: the last 1000 lines of each; simulator.txt once when both
      # parts' are the same); the tables over the whole demo list (fps.txt, hitches.txt, metrics.txt, v11.txt,
      # overhead-vis.txt) are written again from the merged logs with the single job's commands — both parts in DEMOS
      # order (the gates themselves ran in the parts)
      - name: Merge the sim-smoke parts
        if: always()
        run: |
          mkdir -p results
          joined="simulator.txt alive.txt loading.txt shots.txt demo-specs.txt burst.txt look-run1.txt look-run1-failed.txt gate-run1.txt gate-reruns.txt verify.txt launchctl.txt"
          again="fps.txt hitches.txt metrics.txt v11.txt overhead-vis.txt app.log"
          parts=""
          for p in a b; do
            d=smoke/sim-smoke-$p
            if [ ! -d "$d" ]; then echo "::warning::sim-smoke ($p) left no results"; continue; fi
            parts="$parts $d"
            echo "sim-smoke ($p): $(find "$d" -type f | wc -l | tr -d ' ') files"
            for f in "$d"/*; do
              [ -e "$f" ] || continue
              n=${f##*/}
              case " $joined $again " in *" $n "*) continue;; esac
              if [ -e "results/$n" ]; then echo "::warning::$n came from two jobs (sim-smoke ($p)'s kept)"; fi
              cp -R "$f" results/
            done
          done
          for n in $joined; do
            src=""
            for d in $parts; do if [ -f "$d/$n" ]; then src="$src $d/$n"; fi; done
            # (simulator.txt: once when both parts booted the same simulator — the runner image's — as they do)
            if [ "$n" = simulator.txt ] && [ -f "smoke/sim-smoke-a/$n" ] && cmp -s "smoke/sim-smoke-a/$n" "smoke/sim-smoke-b/$n"; then src="smoke/sim-smoke-a/$n"; fi
            # shellcheck disable=SC2086
            if [ -n "$src" ]; then cat $src > "results/$n"; fi
          done
          src=""
          for d in $parts; do if [ -f "$d/app.log" ]; then src="$src $d/app.log"; fi; done
          if [ -n "$src" ]; then for f in $src; do tail -n 1000 "$f"; done > results/app.log; fi
          if [ -n "$parts" ]; then
            demos="$DEMOS"
            for d in $demos; do
              f=results/app-$d.log
              { echo "== $f"; grep -h -E 'loading took|pipelines built|metal world ready|demo done' "$f" || true; } >> results/fps.txt
            done
            for d in $demos; do grep -H 'hitch' "results/app-$d.log" >> results/hitches.txt || true; done
            grep -H -E '\] probe [a-z]+ td=' results/app-probe.log >> results/hitches.txt || true
            # GPU-side seconds: frames completed, longest gap between two, slowest command buffer (commit -> done)
            echo "== GPU-side stalls (hb lines with gap > 50 ms)" >> results/hitches.txt
            for d in $demos; do grep -H -E 'hb t=.* gap=([5-9][0-9]|[0-9]{3,})ms' "results/app-$d.log" | sed -E 's/ (mode|bugs|vis|parts|stage|hp|kills|mem|avail|demo|rend|cpu|main|dc|inst|tris)=[^ ]*//g' >> results/hitches.txt || true; done
            # shellcheck disable=SC2086
            python3 ios-native/ci/frame_metrics.py --cold firstlaunch --cold-max-ms 150 --menus "$MENUS" results $demos > results/metrics.txt || true
            # v1.1 lines (start, title, threat, queen, lift lock, coach, run) and the layout checks (+ the four-phone run)
            for d in $demos layout layout-pseudo title-pseudo holdhint-pseudo coach3-pseudo levelup-pseudo report-pseudo; do
              grep -H -E 'v11 |layout (ok|FAIL)|layout sizes|report: tightest|hint 2 lines|l10n ' "results/app-$d.log" >> results/v11.txt || true
            done
            # shellcheck disable=SC2086
            python3 ios-native/ci/overhead_vis.py results $OH_VIS > results/overhead-vis.txt 2>&1 || true
          fi
          rm -rf smoke
          echo "merged: $(find results -type f | wc -l | tr -d ' ') files in results/"
          tail -n 4 results/metrics.txt 2>/dev/null || true
      # WP7 «Режиссура»: look numbers of the scenes (ci/look_metrics.py; gates in ci/golden/thresholds.json: HUD-off shots
      # are gated, HUD-on ones measured inside the HUD mask and reported) and the 2-up sheets today | concept | commit
      # (twoup-<scene>.jpg) — informational here until the HUD-off look shots run on every push (FrameLoop -hideHUD)
      # (blocking since native-vx-fix: the results are still written and committed by the steps below, `if: always()`)
      - name: Look metrics and 2-up sheets
        id: look
        run: |
          python3 -m venv /tmp/look && /tmp/look/bin/pip install -q numpy pillow
          set -o pipefail
          rc=0
          /tmp/look/bin/python ios-native/ci/look_metrics.py --gate --json results/look.json results | tee results/look.txt || rc=$?
          /tmp/look/bin/python ios-native/ci/twoup.py --look results/look.json --sha "$GITHUB_SHA" results || true
          exit $rc
      - name: Write status.json
        if: always()
        env:
          R_LOOK: ${{ steps.look.outcome }}
          R_CORE: ${{ needs.core-tests.result }}
          R_BUILD: ${{ needs.build.result }}
          R_SMOKE: ${{ needs.sim-smoke.result }}
          XCODE: ${{ needs.build.outputs.xcode }}
          RUNNER_DESC: ${{ needs.build.outputs.runner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p results
          python3 - <<'PY'
          import json, os
          sha = os.environ["GITHUB_SHA"]
          status = {
              "sha": sha,
              "branch": os.environ["GITHUB_REF_NAME"],
              "jobs": {
                  "core-tests": os.environ.get("R_CORE") or "skipped",
                  "build": os.environ.get("R_BUILD") or "skipped",
                  "sim-smoke": os.environ.get("R_SMOKE") or "skipped",
                  "look-gate": os.environ.get("R_LOOK") or "skipped",
              },
              "xcode": os.environ.get("XCODE", ""),
              "runner": os.environ.get("RUNNER_DESC", ""),
              "run_url": os.environ.get("RUN_URL", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          with open("results/status.json", "w") as f:
              json.dump(status, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps(status, indent=2, ensure_ascii=False))
          PY
          ls -la results
      # C2 «CI results diet»: the published set gets every shot PNG as a JPEG of the same basename (quality 90, 4:4:4 chroma:
      # HUD text, thin lines and single-pixel pores as in the PNG at 100 % crops) and every burst-<name>-NN.jpg sequence as
      # one burst-<name>.mp4 (H.264 CRF 23, yuv420p, 6 frames/s; burst frame NN = video frame NN) — every gate above ran on
      # the originals. ci/diet.py removes an original only after its replacement was read back, keeps the originals with a
      # ::warning:: on any error and always exits 0; this step never fails the job. ffmpeg: the runner's with libx264, else
      # imageio-ffmpeg's bundled binary
      - name: Shrink the result set (shots as JPEG, bursts as H.264)
        if: always()
        continue-on-error: true
        run: |
          py=/tmp/look/bin/python
          if ! "$py" -c 'import PIL' 2>/dev/null; then
            if python3 -m venv /tmp/diet && /tmp/diet/bin/pip install -q pillow; then py=/tmp/diet/bin/python; else py=python3; fi
          fi
          if ! { command -v ffmpeg > /dev/null && ffmpeg -hide_banner -encoders 2>/dev/null | grep -q ' libx264 '; }; then
            "$py" -m pip install -q imageio-ffmpeg || echo "::warning::diet: no ffmpeg with libx264 and imageio-ffmpeg did not install — the bursts stay JPEG"
          fi
          "$py" ios-native/ci/diet.py results || echo "::warning::diet: exit $?"
          du -sh results
      - name: Commit to ci-results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          dest="${GITHUB_REF_NAME}/${short}"
          src="$PWD/results"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The tip of ci-results holds every run's folder (≈ 250 MB of shots each): a checkout of it took the whole job
          # (the step hung for 30 min and was cancelled on several runs). Fetch the tip's commit and trees only
          # (no blobs), write this run's folder as a tree from a temporary index and graft it in as <branch>/<sha7>
          # with mktree — nothing of the other runs is downloaded or checked out.
          attempt() {
            rm -rf ci && git init -q ci && cd ci
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "$remote"
            local gd="$PWD/.git" br="${GITHUB_REF_NAME//\//-}" parent="" old="" entries=""
            if git fetch -q --depth=1 --filter=blob:none origin ci-results 2>/dev/null; then
              parent=$(git rev-parse FETCH_HEAD)
            elif git ls-remote --exit-code -q origin refs/heads/ci-results >/dev/null 2>&1; then
              cd ..; return 1   # the branch exists but the fetch failed: retry (never start ci-results over)
            fi
            GIT_INDEX_FILE="$gd/idx-results" git --git-dir="$gd" --work-tree="$src" -C "$src" add -A .
            local rtree; rtree=$(GIT_INDEX_FILE="$gd/idx-results" git --git-dir="$gd" write-tree)
            if [ -n "$parent" ]; then old=$(git rev-parse -q --verify "${parent}:${br}" || true); fi
            if [ -n "$old" ]; then entries=$(git ls-tree "$old" | awk -F'\t' -v s="$short" '$2 != s'); fi
            local btree; btree=$( { if [ -n "$entries" ]; then printf '%s\n' "$entries"; fi; printf '040000 tree %s\t%s\n' "$rtree" "$short"; } | git mktree --missing )
            local root
            if [ -n "$parent" ]; then
              root=$( { git ls-tree "$parent" | awk -F'\t' -v b="$br" '$2 != b'; printf '040000 tree %s\t%s\n' "$btree" "$br"; } | git mktree --missing )
            else
              root=$(printf '040000 tree %s\t%s\n' "$btree" "$br" | git mktree --missing)
            fi
            local msg="ci: ${GITHUB_REF_NAME}@${short} core=${{ needs.core-tests.result }} build=${{ needs.build.result }} smoke=${{ needs.sim-smoke.result }}"
            local commit
            if [ -n "$parent" ]; then commit=$(git commit-tree "$root" -p "$parent" -m "$msg"); else commit=$(git commit-tree "$root" -m "$msg"); fi
            git push -q origin "${commit}:refs/heads/ci-results"
            local rc=$?
            cd ..
            return $rc
          }
          for i in 1 2 3 4 5 6; do
            if ( attempt ); then echo "pushed results to ci-results:${dest}"; exit 0; fi
            echo "push failed (attempt $i), retrying"; sleep $((i * 3))
          done
          echo "::error::could not push results"; exit 1
