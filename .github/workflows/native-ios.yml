          # arrival)
          run_demo queenlock 8 "-demo queenlock -queenHp 1000000 -seed 3" 0
          # Stage 2 B3: the boss intro's two other paths, log checks only (part b) — `-cine off` (logged, no camera, no slowdown: her
          # warning → arrival takes its 2.0 s of wall as today) and Reduce Motion (`-reduceMotion`: half the length, the push and the
