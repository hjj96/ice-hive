            xcrun simctl install "$UDID" release-sim/IceHive.app
            installed=release
            xcrun simctl launch --terminate-running-process \
              --stdout="$PWD/results/app-release-quiet.log" --stderr="$PWD/results/app-release-quiet-stderr.log" \
              "$UDID" "$BUNDLE_ID"
            sleep 10
            if xcrun simctl spawn "$UDID" launchctl list | grep -q 'UIKitApplication:com.hjj96.icehive'; then
              echo "release-quiet alive" >> results/alive.txt
            else
              echo "release-quiet DEAD" >> results/alive.txt
            fi
            xcrun simctl io "$UDID" screenshot results/release-title-0s.png || true
            # (a plain Release launch logs nothing: it opens in the Info.plist's first orientation, landscape right)
            upright results/release-title-0s.png /dev/null
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
