          run_demo coach 6 "-demo coach -profile fresh -seed 7 -layoutCheck" 0
          run_demo coach3 6 "-demo coach -coachStep 2 -seed 7 -layoutCheck" 0
          # hive pressure: red (converging, urgent marker) and amber (waking)
          run_demo pressure 8 "-demo pressure -pressure red -tier 1 -seed 7" 0
          run_demo pressure-amber 6 "-demo pressure -pressure amber -seed 7" 0
          # menus: upgrade cards, pause menu, mission report (30 Hz over the frozen world)
          run_demo levelup 4 "-demo levelup -seed 5 -layoutCheck" 0
          run_demo pause 4 "-demo pause -seed 5 -layoutCheck" 0
          run_demo pause-nm 4 "-demo pause -tier 2 -seed 5 -layoutCheck" 0
          run_demo end 4 "-demo end -seed 5" 0
          # v1.1 mission report fixtures (committed into the demo's in-memory profile)
          run_demo report-first 4 "-demo report -report first -seed 5 -layoutCheck" 0
          run_demo report-win 4 "-demo report -report win -seed 5 -layoutCheck" 0
          run_demo report-loss 4 "-demo report -report loss -seed 5 -layoutCheck" 0
          run_demo report-chip 4 "-demo report -report chip -seed 5 -layoutCheck" 0
          # Metal API validation (the debug layer; errors assert, so a buffer overrun or a format mismatch in any pass kills the
          # run): the 1400-bug High stress run, the scripted effects peak on High and the extraction shot — not frame-gated
          # (the layer costs CPU). Verify fails on a dead run or any MTLDebug / validation line in their stderr. The GPU
          # particle pass is off in them (-fxSim off): under the layer the simulator's device asserts on its one indirect
          # draw («Indirect draw & dispatch arguments is not supported on this device», native-vx-fix dbff4fe) — that path
          # is validated on a device (README «Исправления по ревью»)
          export SIMCTL_CHILD_MTL_DEBUG_LAYER=1 SIMCTL_CHILD_MTL_DEBUG_LAYER_ERROR_MODE=assert
          run_demo validate-stress 8 "-demo stress1400 -seed 7 -fxSim off" 0
          run_demo validate-fxpeak 6 "-demo calm -fxPeak -fxHigh -fxSim off"
          run_demo validate-extract 8 "-demo extract-cine -seed 3 -fxSim off"
          unset SIMCTL_CHILD_MTL_DEBUG_LAYER SIMCTL_CHILD_MTL_DEBUG_LAYER_ERROR_MODE
          # app lifecycle in a mission (-lifecycleProbe): the background / foreground notifications and a memory warning
          run_demo lifecycle 8 "-demo combat -seed 7 -lifecycleProbe"
          # Metal unusable (-failMetal): a readable message instead of an endless loading screen
          if mine failmetal; then
            xcrun simctl launch --terminate-running-process \
