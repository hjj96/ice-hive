          : > results/verify.txt
          bad=0
          fail() { echo "::error::$*"; echo "$*" >> results/verify.txt; bad=1; }
          # (C1: each part checks the items it ran — the labels in SMOKE_B in part b, every other one in part a)
          mine() { case " $SMOKE_B " in *" $1 "*) [ "$PART" = b ];; *) [ "$PART" = a ];; esac; }
