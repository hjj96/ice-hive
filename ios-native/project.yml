# XcodeGen spec for the native «Ледяной Улей» v2.0: Swift, the world drawn with Metal, HUD / menus as a SpriteKit
# scene rendered into the same Metal pass (SKRenderer).
# Generate the project:  brew install xcodegen && xcodegen generate
# Signing: put `DEVELOPMENT_TEAM = <your team id>` into ios-native/Local.xcconfig (gitignored, read through
# Signing.xcconfig) — it survives every `xcodegen generate`.
name: IceHive

options:
  bundleIdPrefix: com.hjj96
  developmentLanguage: ru
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  IceHiveCore:
    path: IceHiveCore

targets:
  IceHive:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - Info.plist
      - path: App/Resources/Info.plist
        buildPhase: none
    dependencies:
      - package: IceHiveCore
        product: IceHiveCore
      - sdk: SpriteKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: IceHive
        PRODUCT_BUNDLE_IDENTIFIER: com.hjj96.icehive
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        # Meshes/*.png are decoded by ImageIO into straight-alpha RGBA: keep them standard PNGs, no pngcrush
        COMPRESS_PNG_FILES: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    scheme:
      gatherCoverageData: false
      commandLineArguments:
        "-debugHUD": false
        "-demo combat": false
        "-demo beacon": false
        "-demo title": false
        "-demo swarmshot": false
        "-mute": false
        "-storeShot": false
      testTargets:
        - package: IceHiveCore/IceHiveCoreTests

schemes:
  # Release on a device: on-device performance checks (Instruments, Metal HUD) and store screenshots — no DEBUG
  # counters, no Metal API validation (it inflates CPU time; the IceHive scheme keeps it on for development)
  IceHive Release:
    build:
      targets:
        IceHive: all
    run:
      config: Release
      enableGPUValidationMode: disabled
      commandLineArguments:
        "-demo combat": false
        "-demo beacon": false
        "-bugs 1400": false
        "-storeShot": false
    profile:
      config: Release
    archive:
      config: Release
